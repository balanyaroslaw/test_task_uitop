app = 'uitopbackendteststask'
primary_region = 'fra'

[build]

[processes]
  app = 'sh -c "npx prisma migrate deploy && node dist/main.js"'

[[mounts]]
  source = "sqlite_data"
  destination = "/data"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '1GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512